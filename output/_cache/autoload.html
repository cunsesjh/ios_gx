    <script>
    /* [本地增强 2026-09-24] 文件直开检测：直接双击 index.html 时功能/API 不可用，自动引导到本地服务 */
    (function () {
      if (location.protocol !== 'file:') return;
      var ports = [8080, 8081, 8082, 8083, 8084, 8085];
      var overlay = null, probing = false;
      function showTip() {
        if (overlay) return;
        var ov = document.createElement('div');
        ov.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:rgba(20,28,22,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC","Microsoft YaHei",serif;';
        var box = document.createElement('div');
        box.style.cssText = 'max-width:560px;margin:0 24px;padding:36px 40px;background:#f7f1e3;border:2px solid #b6a06a;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);text-align:center;color:#3a3226;';
        box.innerHTML =
          '<div style="font-size:26px;font-weight:900;letter-spacing:2px;margin-bottom:14px;">请双击 <span style="color:#8a2f1d;">「点击这个启动.bat」</span></div>' +
          '<div style="font-size:15px;line-height:1.9;margin-bottom:22px;">当前是以「文件直开」方式打开的网页，<b>功能与存档导入无法使用</b>。<br>请先关闭本页，双击文件夹中的 <b>点击这个启动.bat</b>，浏览器会自动打开本地服务地址。</div>' +
          '<button id="yyRetryBtn" style="font-size:16px;padding:10px 26px;background:#8a2f1d;color:#fff;border:none;border-radius:8px;cursor:pointer;letter-spacing:1px;">我已启动，重新进入</button>' +
          '<div style="font-size:13px;color:#6b6150;margin-top:16px;">或手动访问 http://127.0.0.1:8080</div>';
        ov.appendChild(box);
        document.body.appendChild(ov);
        overlay = ov;
        document.getElementById('yyRetryBtn').onclick = function () { if (overlay) { overlay.remove(); overlay = null; } tryJump(); };
      }
      function tryJump() {
        if (probing) return;
        probing = true;
        var idx = 0;
        (function probe() {
          if (idx >= ports.length) { probing = false; showTip(); return; }
          var x = new XMLHttpRequest();
          x.open('GET', 'http://127.0.0.1:' + ports[idx] + '/api/runtime-key', true);
          x.timeout = 800;
          x.onload = function () {
            if (x.status === 200) { location.replace('http://127.0.0.1:' + ports[idx] + '/'); return; }
            idx++; probe();
          };
          x.onerror = function () { idx++; probe(); };
          x.ontimeout = function () { idx++; probe(); };
          x.send();
        })();
      }
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', tryJump);
      } else {
        tryJump();
      }
    })();
    </script>

    <main class="home-shell">
