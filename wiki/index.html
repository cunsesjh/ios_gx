<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烟雨江湖 · 烟雨百科</title>
    <meta name="description" content="查询烟雨江湖物品、装备、武学、秘籍、丹药、食物、任务、材料与杂物资料">
    <link rel="stylesheet" href="../shared/tool_page.css?v=1.4.38">
    <link rel="stylesheet" href="./wiki.css?v=1.4.38">
    <link rel="stylesheet" href="../shared/theme-switch.css?v=1.4.38">
    <link id="wuxiaThemeStylesheet" rel="stylesheet" href="../shared/wuxia-theme.css?v=1.4.38">
    <link rel="stylesheet" href="../shared/feature_shell.css?v=1.4.38">
    <link rel="stylesheet" href="../shared/jianghu_companion.css?v=1.4.38">
    <link rel="stylesheet" href="../shared/mobile.css?v=1.4.38">
    <script src="../shared/opencc-js-cn2t.min.js?v=1.4.38"></script>
    <script src="../shared/i18n.js?v=1.4.38"></script>
    <script src="../shared/theme.js?v=1.4.38"></script>
</head>
<body class="wuxia-simulator">
    <div class="app-container wiki-app">
        <div class="theme-switch" role="group" aria-label="界面与语言">
            <button type="button" data-theme-choice="bright" aria-pressed="false">明亮</button>
            <button type="button" data-theme-choice="care" aria-pressed="false">护眼</button>
            <span class="preference-divider" aria-hidden="true"></span>
            <button type="button" data-language-choice="zh-CN" aria-pressed="false">简体</button>
            <button type="button" data-language-choice="zh-TW" aria-pressed="false">繁體</button>
        </div>
        <header class="app-header">
            <div class="app-title-row"><h1>烟雨百科</h1><span id="appVersion" class="app-version"></span></div>
            <nav class="sim-nav" aria-label="收藏功能快捷入口"><a href="../index.html">首页</a></nav>
        </header>
        <section class="wiki-intro" aria-labelledby="wikiIntroTitle">
            <div><p class="wiki-kicker">江湖万象，一卷可查</p><h2 id="wikiIntroTitle">游戏资料总览</h2></div>
            <p>无需导入存档。购买、配方、图纸与获取来源只展示已整理事实；尚未闭环的内容会明确标为待补证。</p>
            <span id="wikiDataVersion" class="wiki-version"></span>
        </section>
        <nav id="wikiCategoryNav" class="module-tool-switcher" role="tablist" aria-label="百科小模块切换">
            <button class="module-tool-link" type="button" role="tab" aria-selected="false" data-category="item">物品百科</button>
            <button class="module-tool-link" type="button" role="tab" aria-selected="false" data-category="equipment">装备百科</button>
            <button class="module-tool-link" type="button" role="tab" aria-selected="false" data-category="martial">武学百科</button>
            <button class="module-tool-link" type="button" role="tab" aria-selected="false" data-category="secret">秘籍百科</button>
            <button class="module-tool-link" type="button" role="tab" aria-selected="false" data-category="medicine">丹药百科</button>
            <button class="module-tool-link" type="button" role="tab" aria-selected="false" data-category="food">食物百科</button>
            <a class="module-tool-link" role="tab" aria-selected="false" href="../task/index.html">任务百科</a>
            <button class="module-tool-link" type="button" role="tab" aria-selected="false" data-category="material">材料百科</button>
            <button class="module-tool-link" type="button" role="tab" aria-selected="false" data-category="misc">杂物百科</button>
        </nav>
        <section class="wiki-toolbar" aria-label="百科筛选">
            <label><span>搜索</span><input id="wikiSearch" type="search" placeholder="搜索名称、说明、地点、配方或来源" autocomplete="off"></label>
            <label><span>小分类</span><select id="wikiSubcategory"><option value="all">全部小分类</option></select></label>
            <span id="wikiResultMeta" class="wiki-result-meta" aria-live="polite"></span>
        </section>
        <main class="wiki-workspace">
            <section class="wiki-list-panel" aria-label="百科条目">
                <div id="wikiList" class="wiki-list"></div>
                <div id="wikiEmpty" class="wiki-empty" hidden>没有找到匹配资料。</div>
                <nav id="wikiPagination" class="wiki-pagination" aria-label="百科翻页">
                    <button id="wikiPrev" type="button">上一页</button><span id="wikiPageMeta"></span><button id="wikiNext" type="button">下一页</button>
                </nav>
            </section>
        </main>
        <footer class="app-footer"><p>客户端数据为主要事实源；补充配方数据来源于 <a href="https://wiki.biligame.com/yanyu/" target="_blank" rel="noopener">烟雨江湖 Wiki</a>，并逐条标注来源。</p></footer>
    </div>
    <script src="../shared/version.js?v=1.4.38"></script>
    <script src="./encyclopedia_data.js?v=1.4.38"></script>
    <script src="./wiki.js?v=1.4.38"></script>
    <script src="../shared/feature_registry.js?v=1.4.38"></script>
    <script src="../shared/feature_shell.js?v=1.4.38"></script>
    <script src="../shared/site_cache.js?v=1.4.38"></script>
    <script src="../shared/jianghu_companion.js?v=1.4.38"></script>
    <script src="../shared/page_reset.js?v=1.4.38"></script>
</body>
</html>
